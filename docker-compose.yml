# Local development services for student-lms: MySQL, Redis and Mailpit.
# MySQL is pinned to the same version we run in RDS so local behaviour matches prod.
#
# Usage:
#   npm run db:setup   # start MySQL + download & import the seed dump
#   npm run db:up      # just start MySQL
#   npm run db:down    # stop MySQL (keeps data)
#   npm run db:reset   # wipe the volume and re-seed from scratch
#
#   docker compose up -d              # start everything (mysql + redis + mailpit)
#   docker compose up -d redis mailpit
#
# All values below can be overridden from your .env file (see .env.example).

services:
  mysql:
    image: mysql:8.0.42
    container_name: student-lms-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-lms_dev_db}
    ports:
      - '${MYSQL_PORT:-3306}:3306'
    volumes:
      - student_lms_mysql_data:/var/lib/mysql
    healthcheck:
      test:
        [
          'CMD',
          'mysqladmin',
          'ping',
          '-h',
          'localhost',
          '-uroot',
          '-p${MYSQL_ROOT_PASSWORD:-root}',
        ]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  # Caches + distributed locks (src/server/redis/*). The app only connects when
  # ENABLE_REDIS=true; with it unset every cache/lock degrades to the DB path,
  # so this container is optional unless you're working on cached code paths.
  redis:
    image: redis:7.4.10
    container_name: student-lms-redis
    restart: unless-stopped
    # appendonly keeps the keyspace across container restarts. Harmless for a
    # cache — drop the volume below (or `docker compose down -v`) to start clean.
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '${REDIS_PORT:-6379}:6379'
    volumes:
      - student_lms_redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s

  # Local SMTP sink for outgoing mail (login OTP emails — src/server/auth/v2/otpEmail.ts
  # sends via localhost:1025 whenever NODE_ENV=development instead of AWS SES).
  # Read the captured mail in the web UI at http://localhost:8025.
  mailpit:
    image: axllent/mailpit:v1.30.7
    container_name: student-lms-mailpit
    restart: unless-stopped
    environment:
      # Without MP_DATABASE mailpit keeps mail in memory only; this persists it
      # in the volume below so captured OTPs survive a container restart.
      MP_DATABASE: /data/mailpit.db
      MP_MAX_MESSAGES: 5000
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
    ports:
      - '${MAILPIT_SMTP_PORT:-1025}:1025' # SMTP — what nodemailer talks to
      - '${MAILPIT_UI_PORT:-8025}:8025' # web UI / API
    volumes:
      - student_lms_mailpit_data:/data
    healthcheck:
      test: ['CMD', '/mailpit', 'readyz']
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s

  # The production image (see Dockerfile) run against the containers above, so
  # you can sanity-check a build before pushing it to ECR. Behind a profile so
  # plain `docker compose up -d` still starts only the infra services.
  #
  #   docker compose --profile app up -d --build app
  #   open http://localhost:3000
  #
  # This is NOT the dev loop — there is no HMR and the client bundle is built
  # once, at image build time. Keep using `npm run dev` (port 3002) for that.
  app:
    profiles: ['app']
    build:
      context: .
    container_name: student-lms-app
    restart: unless-stopped
    # Secrets and per-developer config come from .env.local; the overrides below
    # win because `environment` is applied after `env_file`. They have to exist:
    # .env.local points at 127.0.0.1, which inside the container is the
    # container itself, not your host.
    env_file:
      - .env.local
    environment:
      DATABASE_URL: mysql://root:${MYSQL_ROOT_PASSWORD:-root}@mysql:3306/${MYSQL_DATABASE:-lms_dev_db}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      PORT: 3000
    ports:
      - '${APP_PORT:-3000}:3000'
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  student_lms_mysql_data:
    name: student_lms_mysql_data
  student_lms_redis_data:
    name: student_lms_redis_data
  student_lms_mailpit_data:
    name: student_lms_mailpit_data
