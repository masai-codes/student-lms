# student-lms Docker Compose — app + optional bundled MySQL.
#
# Modes:
#   Full stack (app + MySQL):       npm run docker:up
#   App only (external / host DB):  npm run docker:up:app
#   MySQL only (native app dev):    npm run db:up
#
# DB_HOST (.env) controls where the app container connects:
#   mysql                  — bundled mysql service (set automatically by docker:up)
#   host.docker.internal   — MySQL on the host machine (default for docker:up:app)
#   <remote-host>          — centralized / RDS database

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: student-lms-app
    restart: unless-stopped
    ports:
      - '${APP_PORT:-3000}:${PORT:-3000}'
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    env_file:
      - path: .env.local
        required: false
    environment:
      NODE_ENV: production
      PORT: ${PORT:-3000}
    depends_on:
      mysql:
        condition: service_healthy
        required: false

  mysql:
    profiles:
      - db
    image: mysql:8.0.42
    container_name: student-lms-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-lms_dev_db}
    ports:
      - '${MYSQL_PORT:-3306}:3306'
    volumes:
      - student_lms_mysql_data:/var/lib/mysql
    healthcheck:
      test:
        [
          'CMD',
          'mysqladmin',
          'ping',
          '-h',
          'localhost',
          '-uroot',
          '-p${MYSQL_ROOT_PASSWORD:-root}',
        ]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

volumes:
  student_lms_mysql_data:
    name: student_lms_mysql_data
